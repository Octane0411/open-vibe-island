name: Release gate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-blocked:
    runs-on: macos-26
    steps:
      - name: Require verified fork release configuration
        run: |
          echo "::error::Distribution is blocked. Complete docs/release-signing.md: fork identity and keys, signed/notarized artifact checks, platform tests, and an upgrade/recovery test."
          echo "::error::Publish and anonymously verify assets before promoting update metadata. Draft releases must never update appcast or package-manager metadata."
          exit 1
