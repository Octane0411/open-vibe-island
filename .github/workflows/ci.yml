name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**', 'refactor/**', 'chore/**', 'investigate/**']

permissions:
  contents: read

jobs:
  harness:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: ['26.0.1', '26.6']
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Record environment
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
          node --version
          sw_vers
          uname -m
          echo "Runner image: $ImageVersion"
          shasum -a 256 Package.resolved
      - name: Run isolated automated checks
        run: zsh scripts/harness.sh ci
      - name: Verify bridge tests with a constrained task pool
        timeout-minutes: 2
        run: |
          # Constrain only the test process. Swift 6.2 Package Manager itself
          # stalls before launching tests when it inherits this setting.
          test_bin_dir="$(swift build --force-resolved-versions --show-bin-path)"
          test_bundle="$test_bin_dir/OpenIslandPackageTests.xctest/Contents/MacOS/OpenIslandPackageTests"
          swift_bin="$(xcrun --find swift)"
          test_helper="${swift_bin%/bin/swift}/libexec/swift/pm/swiftpm-testing-helper"
          platform_developer="$(xcrun --sdk macosx --show-sdk-platform-path)/Developer"
          test -f "$test_bundle"
          test -x "$test_helper"
          env LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 \
            DYLD_FRAMEWORK_PATH="$platform_developer/Library/Frameworks" \
            DYLD_LIBRARY_PATH="$platform_developer/usr/lib" \
            "$test_helper" --test-bundle-path "$test_bundle" --testing-library swift-testing \
            --filter 'BridgeDecisionSafetyTests|CodexAppServerTimeoutTests|OpenCodePluginContractTests'
      - name: Compile Intel target
        run: swift build --force-resolved-versions --arch x86_64

  package-verify:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Fetch exact packaging tool
        run: |
          git clone https://github.com/create-dmg/create-dmg.git "$RUNNER_TEMP/create-dmg"
          git -C "$RUNNER_TEMP/create-dmg" checkout --detach 994a036532d3ac1bb1cd5a425a0d5d796ecbed83
          test "$(git -C "$RUNNER_TEMP/create-dmg" rev-parse HEAD)" = 994a036532d3ac1bb1cd5a425a0d5d796ecbed83
          "$RUNNER_TEMP/create-dmg/create-dmg" --version
      - name: Build development package without launching it
        env:
          OPEN_ISLAND_CREATE_DMG_TOOL: ${{ runner.temp }}/create-dmg/create-dmg
          OPEN_ISLAND_PACKAGE_SMOKE: 'false'
          OPEN_ISLAND_UNIVERSAL: 'true'
        run: zsh scripts/package-app.sh
