name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'refactor/**'
      - 'chore/**'
      - 'investigate/**'
      - 'codex/**'

permissions:
  contents: read

jobs:
  harness:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show Swift Version
        run: swift --version

      - name: Run CI checks
        run: zsh scripts/harness.sh ci

  package-verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out pinned DMG tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: create-dmg/create-dmg
          ref: a2b71d0fda6d0df2a86dc7f67082d4d73e84c59f # 1.3.0
          path: .build-tools/create-dmg
          persist-credentials: false

      - name: Add DMG tool to PATH
        run: echo "$GITHUB_WORKSPACE/.build-tools/create-dmg" >> "$GITHUB_PATH"

      - name: Build and package
        run: zsh scripts/package-app.sh

      # Bundle structure is verified inside package-app.sh itself.
      # No separate verify step needed — the script exits non-zero on
      # missing files.

  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build iPhone and Watch companion
        run: >-
          xcodebuild -project ios/OpenIslandMobile.xcodeproj
          -scheme OpenIslandMobile -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
